<!DOCTYPE html>
<html lang="id">
<head>
  <title>Formulir Pendaftaran Konsultasi SELARAS</title>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulir Pendaftaran Konsultasi SELARAS — Unit Layanan Disabilitas Dinas Pendidikan Provinsi DKI Jakarta">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --biru-tua: #15318f;
    --biru: #1f4fd1;
    --biru-muda: #e3f1fb;
    --langit: #cfe8f6;
    --kuning: #f5b82e;
    --kuning-muda: #fff5d9;
    --ungu: #7b5bc9;
    --merah: #c2362f;
    --merah-muda: #fdecea;
    --hijau: #1d7a4c;
    --hijau-muda: #e5f5ec;
    --teks: #1b2433;
    --teks-2: #4a566b;
    --garis: #d5deea;
    --permukaan: #ffffff;
    --latar: #f3f8fc;
    --bayang: 0 1px 2px rgba(21, 49, 143, .06), 0 8px 24px rgba(21, 49, 143, .07);
    --radius: 14px;
    --fokus: 0 0 0 3px rgba(245, 184, 46, .55);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--latar); color: var(--teks);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  img { max-width: 100%; display: block; }
  a { color: var(--biru); }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; color: var(--biru-tua); }
  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
  h2 { font-size: 1.3rem; font-weight: 800; }
  h3 { font-size: 1.08rem; font-weight: 700; }
  p { margin: 0 0 .9em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Kerangka ---------- */
  .kop { background: var(--langit); border-bottom: 4px solid var(--kuning); }
  .kop img { width: 100%; max-width: 1100px; margin: 0 auto; }
  .wadah { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  .kartu { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius); box-shadow: var(--bayang); padding: 24px; }
  .kartu + .kartu { margin-top: 16px; }
  .kaki { text-align: center; color: var(--teks-2); font-size: .85rem; padding: 8px 16px 28px; }
  .kaki strong { color: var(--teks); }
  @media (max-width: 560px) { .kartu { padding: 18px 16px; } body { font-size: 16px; } h1 { font-size: 1.4rem; } }

  /* ---------- Tombol ---------- */
  .tombol {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 10px 22px; border-radius: 999px; border: 2px solid transparent;
    font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; transition: background-color .15s, border-color .15s;
  }
  .tombol:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .pilihan input:focus-visible + span { outline: none; box-shadow: var(--fokus); }
  .tombol-utama { background: var(--biru); color: #fff; }
  .tombol-utama:hover { background: var(--biru-tua); }
  .tombol-utama[disabled] { background: #9aa9c9; cursor: not-allowed; }
  .tombol-garis { background: #fff; color: var(--biru-tua); border-color: var(--biru); }
  .tombol-garis:hover { background: var(--biru-muda); }
  .tombol-wa { background: #1f9d55; color: #fff; }
  .tombol-wa:hover { background: #17834a; }
  .tombol-teks { background: none; border: none; color: var(--biru); font-weight: 700; cursor: pointer; padding: 4px 6px; font: inherit; text-decoration: underline; }
  .tombol-kecil { min-height: 38px; padding: 6px 14px; font-size: .9rem; }
  .baris-tombol { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  .baris-tombol.antara { justify-content: space-between; }
  @media (max-width: 480px) { .baris-tombol .tombol { flex: 1 1 100%; } .baris-tombol.antara { flex-direction: column-reverse; } }

  /* ---------- Pengumuman ---------- */
  .beranda-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .beranda-logo img { width: 64px; height: 64px; }
  .beranda-logo small { display: block; color: var(--teks-2); font-weight: 600; font-size: .85rem; }
  .penekanan { background: var(--kuning-muda); border-left: 5px solid var(--kuning); padding: 14px 16px; border-radius: 10px; font-weight: 800; color: #5b4300; margin: 16px 0; }
  .catatan { background: var(--biru-muda); border-radius: 10px; padding: 12px 16px; font-size: .95rem; color: var(--teks-2); }
  .catatan ul { margin: 6px 0 0; padding-left: 20px; }

  /* ---------- Progres ---------- */
  .progres { margin-bottom: 16px; }
  .progres-teks { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; color: var(--teks-2); font-weight: 600; margin-bottom: 8px; }
  .progres-teks b { color: var(--biru-tua); }
  .progres-batang { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .progres-batang span { height: 7px; border-radius: 4px; background: #d8e3f0; }
  .progres-batang span.selesai { background: var(--biru); }
  .progres-batang span.aktif { background: var(--kuning); }

  /* ---------- Bidang formulir ---------- */
  .bagian-label { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ungu); margin-bottom: 4px; }
  .bidang { margin: 0 0 22px; border: 0; padding: 0; min-width: 0; }
  .bidang > label, .bidang > legend { display: block; font-weight: 700; margin-bottom: 6px; padding: 0; color: var(--teks); }
  .wajib { color: var(--merah); margin-left: 2px; }
  .opsional { color: var(--teks-2); font-weight: 500; font-size: .9rem; }
  .petunjuk { font-size: .92rem; color: var(--teks-2); margin: -2px 0 8px; }
  .petunjuk strong { color: var(--teks); }
  input[type=text], input[type=tel], input[type=email], input[type=date], input[type=password], input[type=search], textarea, select {
    width: 100%; font: inherit; color: var(--teks); background: #fff; border: 1.5px solid #b9c6d8; border-radius: 10px; padding: 11px 14px; min-height: 48px;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea.besar { min-height: 200px; }
  input[readonly] { background: #f1f5fa; color: var(--teks-2); }
  .bidang.ada-galat input, .bidang.ada-galat textarea, .bidang.ada-galat select { border-color: var(--merah); }
  .galat { color: var(--merah); font-size: .9rem; font-weight: 600; margin: 6px 0 0; display: flex; gap: 6px; }
  .galat::before { content: '⚠'; }
  .hitung { font-size: .8rem; color: var(--teks-2); text-align: right; margin-top: 4px; }

  .pilihan-grup { display: grid; gap: 10px; }
  .pilihan-grup.dua { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .pilihan { position: relative; display: block; cursor: pointer; }
  .pilihan input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pilihan > span {
    display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; border: 1.5px solid #b9c6d8; border-radius: 12px; background: #fff; font-weight: 600;
  }
  .pilihan > span::before { content: ''; flex: 0 0 20px; height: 20px; border-radius: 50%; border: 2px solid #8a9ab3; background: #fff; }
  .pilihan input[type=checkbox] + span::before { border-radius: 5px; }
  .pilihan:hover > span { border-color: var(--biru); }
  .pilihan input:checked + span { border-color: var(--biru); background: var(--biru-muda); color: var(--biru-tua); }
  .pilihan input:checked + span::before { border-color: var(--biru); background: radial-gradient(circle, var(--biru) 45%, #fff 50%); }
  .pilihan input[type=checkbox]:checked + span::before { background: var(--biru); box-shadow: inset 0 0 0 3px #fff; }
  .layanan .pilihan > span { align-items: flex-start; }
  .layanan .pilihan > span::before { margin-top: 3px; }
  .teks-pilihan { display: block; }
  .layanan small { display: block; font-weight: 500; color: var(--teks-2); }

  .sub { border: 1px solid var(--garis); border-radius: 12px; padding: 18px 16px 2px; margin-bottom: 18px; background: #fbfdff; }
  .sub h3 { margin-bottom: 12px; }
  .info { display: flex; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--biru-muda); color: var(--teks); font-size: .95rem; margin-bottom: 18px; }
  .info.ok { background: var(--hijau-muda); }
  .info.peringatan { background: var(--kuning-muda); }
  .info.bahaya { background: var(--merah-muda); }
  .info .ikon { font-size: 1.2rem; line-height: 1.3; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
  .npsn-baris { display: flex; gap: 10px; }
  .npsn-baris input { flex: 1; }
  .sekolah-kartu { border: 1.5px solid var(--hijau); background: var(--hijau-muda); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
  .sekolah-kartu b { display: block; color: var(--hijau); }
  .tgl-tiga { display: grid; grid-template-columns: 0.8fr 1.5fr 1fr; gap: 10px; }
  .tgl-label { display: block; font-size: .82rem; font-weight: 600; color: var(--teks-2); margin-bottom: 4px; }
  .usia { font-size: 1.05rem; font-weight: 800; color: var(--biru-tua); background: var(--biru-muda); padding: 11px 14px; border-radius: 10px; min-height: 48px; }

  /* ---------- Unggah ---------- */
  .unggah { position: relative; border: 2px dashed #9fb2cc; border-radius: 14px; padding: 26px 18px; text-align: center; background: #fbfdff; }
  .unggah.seret { border-color: var(--biru); background: var(--biru-muda); }
  .unggah input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .unggah .ikon-besar { font-size: 2rem; }
  .berkas-terpilih { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--hijau); background: var(--hijau-muda); border-radius: 12px; padding: 12px 14px; }
  .berkas-terpilih .nama { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
  .berkas-terpilih small { display: block; font-weight: 500; color: var(--teks-2); }

  /* ---------- Ringkasan ---------- */
  .ringkas { margin-bottom: 18px; }
  .ringkas-kepala { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--biru-muda); margin-bottom: 8px; }
  .ringkas-kepala h3 { margin: 6px 0; }
  .ringkas dl { display: grid; grid-template-columns: minmax(140px, 38%) 1fr; gap: 6px 14px; margin: 0; font-size: .95rem; }
  .ringkas dt { color: var(--teks-2); }
  .ringkas dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; }
  @media (max-width: 520px) { .ringkas dl { grid-template-columns: 1fr; } .ringkas dd { margin-bottom: 6px; } }

  /* ---------- Modal ---------- */
  .modal-latar { position: fixed; inset: 0; background: rgba(15, 25, 50, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 18px; max-width: 520px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 26px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); border-top: 6px solid var(--kuning); }
  .modal.tolak { border-top-color: var(--merah); }
  .modal h2 { margin-bottom: 12px; }
  .modal-ikon { font-size: 2.2rem; margin-bottom: 6px; }

  .memuat { position: fixed; inset: 0; background: rgba(255, 255, 255, .85); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; z-index: 60; font-weight: 700; color: var(--biru-tua); text-align: center; padding: 16px; }
  .putar { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--biru-muda); border-top-color: var(--biru); animation: putar 1s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 3s; } }

  .sukses { text-align: center; }
  .sukses .centang { width: 72px; height: 72px; border-radius: 50%; background: var(--hijau-muda); color: var(--hijau); font-size: 2.4rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .noreg { max-width: 100%; overflow-wrap: anywhere; font-size: clamp(1.05rem, 4.6vw, 1.5rem); font-weight: 800; letter-spacing: .04em; color: var(--biru-tua); background: var(--kuning-muda); border: 2px dashed var(--kuning); display: inline-block; padding: 8px 18px; border-radius: 12px; margin: 6px 0 14px; }
</style>
</head>
<body>
  <a href="#app" class="sr">Lewati ke formulir</a>
  <header class="kop" role="banner">
    <img id="kop-img" alt="Unit Layanan Disabilitas — Dinas Pendidikan Provinsi DKI Jakarta">
  </header>

  <main class="wadah">
    <div id="app" aria-live="polite">
      <div class="kartu"><p>Memuat formulir…</p></div>
    </div>
  </main>

  <footer class="kaki" id="kaki"></footer>

  <noscript><div class="wadah"><div class="kartu">Formulir ini membutuhkan JavaScript. Silakan aktifkan JavaScript pada peramban Anda.</div></div></noscript>

  <script>
    /* Diagnosa: bila ada skrip yang gagal, tampilkan penyebabnya di layar (bukan loading terus). */
    window.__galatMuat = [];
    window.addEventListener('error', function (e) {
      window.__galatMuat.push((e.message || 'Galat') + (e.lineno ? ' (baris ' + e.lineno + ')' : ''));
    });
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || app.textContent.indexOf('Memuat formulir') === -1) return;
      var g = window.__galatMuat.length ? window.__galatMuat.join('<br>') : 'Tidak ada pesan galat.';
      var cek = !window.CONFIG_PUBLIK ? 'Tidak dapat terhubung ke server formulir. Periksa koneksi internet Anda lalu muat ulang halaman.'
        : !window.Logika ? 'Logika formulir tidak termuat (periksa file Logika — pastikan disalin utuh).'
        : 'Skrip formulir tidak berjalan (periksa file FormJs — pastikan disalin utuh sampai baris terakhir &lt;/script&gt;).';
      app.innerHTML = '<div class="kartu"><h2>Formulir belum dapat dimuat</h2><p>' + cek + '</p>' +
        '<p class="petunjuk">Detail teknis untuk admin:<br><code>' + g.replace(/</g, '&lt;') + '</code></p></div>';
    }, 25000);
  </script>
  <script src="config.js?v=mw1g1d1u"></script>
  <script src="logika.js?v=ba82991c"></script>
  <script src="aset-kop.js?v=ec3a5d82"></script>
  <script>
    /* Versi GitHub Pages: konfigurasi publik diambil dari Apps Script (pengaturan Panel Admin tetap berlaku). */
    (function () {
      var kop = document.getElementById('kop-img');
      kop.src = ASET.kop;
      function esc(s) { return String(s == null ? '' : s).replace(/</g, '&lt;'); }
      function gagal() {
        document.getElementById('app').innerHTML = '<div class="kartu"><h2>Formulir belum dapat dimuat</h2>' +
          '<p>Tidak dapat terhubung ke server formulir. Periksa koneksi internet Anda, lalu coba lagi.</p>' +
          '<p><button type="button" class="tombol-utama" onclick="location.reload()">Muat Ulang</button></p></div>';
      }
      fetch(window.SELARAS_API + '?aksi=konfigurasi', { redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (j) {
          if (!j || !j.ok || !j.konfigurasi) throw new Error('Konfigurasi kosong');
          var C = window.CONFIG_PUBLIK = j.konfigurasi;
          window.Logika = buatLogika(C);
          document.title = C.NAMA_APLIKASI || document.title;
          if (C.KOP_HEADER_URL) kop.src = C.KOP_HEADER_URL;
          document.getElementById('kaki').innerHTML =
            '<strong>' + esc(C.NAMA_UNIT) + '</strong><br>' + esc(C.ALAMAT_KANTOR) +
            '<br>Instagram: ' + esc(C.instagramHandle) + ' · WhatsApp Admin: ' + esc(C.whatsapp);
          var s = document.createElement('script');
          s.src = 'formulir.js?v=1167a9f7';
          document.body.appendChild(s);
        })
        .catch(function (e) { window.__galatMuat.push(String(e && e.message || e)); gagal(); });
    })();
  </script>
</body>
</html>
